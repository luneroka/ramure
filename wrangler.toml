name = "ramure"
main = "worker/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# The built app is served by the same Worker: one origin, no CORS, cookies just work.
# Request logs and errors in the dashboard (Workers & Pages → ramure → Logs).
[triggers]
crons = ["0 4 * * *"]

[observability]
enabled = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "ramure"
database_id = "edbb1d72-2033-4650-97b1-7c1c06d81fb9"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ramure-media"

# Production values. Local development overrides them in .dev.vars (git-ignored):
#   APP_ORIGIN=http://localhost:5175
#   DEV_ECHO_LINKS=1
[vars]
APP_ORIGIN = "https://ramure.ramure.workers.dev"
MAIL_FROM = "Ramure <contact@contact.luneroka.com>"

# Secrets, set with `wrangler secret put`: RESEND_API_KEY, CODE_PEPPER, ADMIN_EMAIL
#
# ADMIN_EMAIL is the operator's own address — it decides who is administrator and
# receives access requests. It is a secret rather than a var because this file is
# readable by anyone who can read the repository, and a personal address in source
# is harvested. It is not a credential: sign-in is invite-only and the flag also
# lives in the database, so an unset ADMIN_EMAIL costs the notification mails, not
# the account. The administration page says so when it is missing.

# ---------------------------------------------------------------------------
# Staging: a second Worker with its own database and bucket, for trying things
# that must not touch the family's real trees.
#
# Nothing is inherited from the top of this file — Wrangler environments start
# empty, so every binding and var is repeated here on purpose. Deployed by hand
# with `npm run deploy:staging`; Workers Builds only auto-deploys production
# from main, so staging never moves unless you move it.
#
# database_id is filled in by `npx wrangler d1 create ramure-staging` — see
# docs/STAGING.md.
# ---------------------------------------------------------------------------
[env.staging]
name = "ramure-staging"

[env.staging.observability]
enabled = true

[env.staging.assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[env.staging.d1_databases]]
binding = "DB"
database_name = "ramure-staging"
database_id = "PASTE_THE_ID_FROM_D1_CREATE"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "MEDIA"
bucket_name = "ramure-media-staging"

[env.staging.vars]
APP_ORIGIN = "https://ramure-staging.ramure.workers.dev"
MAIL_FROM = "Ramure <contact@contact.luneroka.com>"

# No [triggers] here on purpose: the nightly backup and reaper cron belongs to
# production. Staging can be run by hand with
#   curl "https://ramure-staging.ramure.workers.dev/cdn-cgi/handler/scheduled"
