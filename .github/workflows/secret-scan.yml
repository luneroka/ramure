name: Secret scan

# The one workflow that runs automatically. The main CI is manual
# (`workflow_dispatch`) because the account's free Actions minutes are spent
# and the full suite runs locally before every merge — but a committed secret
# is the one mistake a local suite cannot catch, and this takes seconds.
on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Gitleaks scans history, not just the tip: a secret committed and
          # then removed is still in the repository and still compromised.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
