name: Secret scan

# A committed secret is the one mistake the local suite cannot catch, so this runs
# on every push and pull request. It was removed on 9 September 2026 because the
# repository was private and its Actions minutes were spent — the job never started
# and the check was permanently red, which is worse than no check at all. The
# repository is public now, so it runs for free.
#
# The same scan runs locally through `scripts/scan-secrets.sh`, part of /preflight.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Scan history, not just the tip: a secret committed and then removed is
          # still in the repository and still compromised.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
