# Dependency updates, once a week, grouped so one pull request carries them all.
# Major versions of the build and test tooling are left out: those are deliberate migrations, not routine bumps.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    groups:
      all-dependencies:
        patterns: ['*']
        # jest-dom 8 peers on vitest 5 only (>=5 <6), while we run vitest 4. Left in the
        # group, its major would sit in the weekly pull request and block the routine
        # bumps beside it. It moves with the vitest 5 migration, as its own pull request.
        exclude-patterns: ['@testing-library/jest-dom']
    ignore:
      - dependency-name: vite
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitest/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@vitejs/*'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # The Workers test plugin peers on vitest's major and pins its own wrangler and
      # miniflare, so a major of it moves with vitest, as one deliberate migration. It
      # replaced @cloudflare/vitest-pool-workers on 12 November 2026; that 0.x package
      # was held on minors too, since npm read 0.12 -> 0.22 as a minor carrying the
      # next vitest major.
      - dependency-name: '@cloudflare/vitest-plugin'
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 1
